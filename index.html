<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon-rounded.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FBF9F9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FocusFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <title>FocusFlow | Minimalist Productivity</title>
    <!-- Hell/Dunkel vor dem ersten Bild setzen (gespeicherte Wahl, sonst Systemeinstellung), damit nichts aufblitzt -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('focusflow_theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#111010' : '#FBF9F9');
      })();
    </script>
    <!-- Material Symbols (alle vier Achsen, die der Icon-Baustein setzt). Outfit und Plus Jakarta Sans liegen als Dateien in src/assets/fonts. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..200&amp;display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
